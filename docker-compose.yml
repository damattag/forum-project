services:
  postgres:
    container_name: forum-project-pg
    image: postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: forum-project
      PGDATA: /data/postgres
    volumes:
      - ./data/pg:/data/postgres

  redis:
    container_name: forum-project-redis
    image: redis
    ports:
      - 6379:6379
    environment:
      REDIS_PASSWORD: docker
    volumes:
      - ./data/redis:/data
